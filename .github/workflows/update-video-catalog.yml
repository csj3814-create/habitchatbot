name: Update Video Catalog

# Weekly check of the 출연 영상 playlists. New videos land in
# data/videoCatalog.json as a commit on main, which the server picks up on its
# next deploy. No commit when nothing changed.

on:
  schedule:
    # Mondays 09:00 KST
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=optional --ignore-scripts

      - run: node scripts/update_video_catalog.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/videoCatalog.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/videoCatalog.json
          git commit -m "Refresh 출연 영상 catalog"
          git push
